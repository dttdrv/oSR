known_working_assumptions:
  - Windows 11 primary target.
  - Primary hardware target is AMD Radeon 760M / Ryzen 5 7640HS class laptop.
  - Output target is 1920x1200.
  - Initial bridge is FSR3.1 / FidelityFX API style DX12 input.
  - Reference projects are clean-room references only unless license review changes that.
  - SDK/sample apps are the first validation targets.
  - oSR's research differentiator is trust-field temporal reconstruction with explainable confidence-driven history selection.
  - Manual quality control uses DLSS-style presets plus a custom render-scale slider clamped to one-third through native resolution.
unknowns:
