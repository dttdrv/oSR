current_phase: phase_4
build_status:
  configured: true
  compiled: partial
  tests_passed: true
  last_checked: 2026-04-28
  last_preset: direct-mingw-manual
  notes:
    - Previous full Ninja build passed at commit e91acfd.
    - Current CMake/Ninja configure/build stalls during compiler ABI/tool execution in this sandbox; changed test sources compile and pass via direct MinGW commands.
    - Visual Studio/MSBuild command-line tools were not available in this sandbox, so the AMD sample solution was not built.
    - Standalone WebGL 3D wind tunnel script passed a Node syntax check.
    - Playwright loaded the standalone 3D wind tunnel over temporary localhost and observed the expected page title.
    - Native Win32 3D wind tunnel with settings panel compiled with direct MinGW and stayed open during launch smoke tests.
    - DX12 wind tunnel proof of life compiled and ran, creating D3D12 resources for color/output/depth/MV/reactive and validating FrameContext with zero errors.
    - H1 buffer-truth path uploads synthetic color/depth/MV/reactive inputs to D3D12 textures, reads them back, hashes canonical rows, and writes a capture pack.
    - H2 DX12 presentation smoke path opens a swapchain window, copies color_output to the backbuffer, presents frames, and supports --headless / --present-frames lab modes.
    - Capture packs now include PPM/PGM debug images, exact raw buffers, and artifacts.json manifests for synthetic frame inputs/output.
    - DX12 wind tunnel supports --mv-mode correct|zero|flip-x|flip-y|half-scale|double-scale|jitter-contaminated for motion-vector truth-table testing.
    - Capture metrics now include CPU temporal diagnostics for MV luma/depth residuals and history-trust confusion rates.
    - DX12 wind tunnel supports --metric-gate / --fail-on-diagnostics and returns exit code 3 for severe temporal diagnostic verdicts.
    - tools/run_dx12_mv_sweep.bat runs all current MV truth-table modes headlessly and fail-fast.
    - DX12 debug upscale backend records and executes a real GPU copy path for native-size color input/output resources.
    - Scaled DX12 debug output now records and executes a compute spatial debug upscale path, then readbacks and hashes color_output_after_dispatch against the CPU nearest reference.
    - The current DX12 compute shader is runtime-compiled from embedded HLSL for prototype speed; production packaging should embed bytecode.
    - DX12 wind tunnel supports --reconstruction spatial-gpu|temporal-cpu.
    - The first temporal-cpu mode blends display-space history conservatively and suppresses history in reactive/high-motion regions.
    - osr_sequence_lab.exe compares spatial versus temporal-cpu over deterministic multi-frame synthetic sequences and writes CSV metrics.
    - osr_dx12_wind_tunnel.exe supports --headless --frames N for deterministic sequence metrics through the main DX12 harness executable.
    - Sequence metric gates now include stability improvement, motion ghost proxy, and reactive trail proxy.
    - CPU temporal resolve now uses motion-compensated display-space history lookup from current-to-previous render-pixel motion vectors.
    - CPU temporal resolve rejects history using luma residuals at the reprojected sample and gates sequence runs on edge preservation.
    - CPU temporal resolve rejects history using depth residuals at the reprojected render-space previous-depth sample.
    - Sequence metrics and DX12 metadata now expose depth_rejected_pct and depth_residual_mean.
    - Default motion rejection is tightened to 3 render pixels after final accepted-history ghost metrics exposed excessive low-resolution motion trust.
    - CPU temporal resolve uses bilinear sampling for reprojected display history and previous-depth residual validation.
    - Temporal diagnostics now use the same bilinear subpixel luma/depth reprojection model as the CPU temporal resolve.
    - Sequence lab and DX12 temporal-cpu mode now use a bilinear spatial base instead of nearest-neighbor color.
    - DX12 temporal-cpu capture packs now include history_weight, color_residual, and depth_residual debug maps.
    - Native 3D wind-tunnel executable exposes color, luma, depth, edge-energy, history-weight proxy, and rejection-risk proxy views.
